<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <style>
    .product-title {
      font-family: Arial, sans-serif;
      font-size: 24px;
      font-weight: bold;
      fill: black;
    }
    .product-name {
      font-family: Arial, sans-serif;
      font-size: 18px;
      fill: black;
    }
    .category-title {
      font-family: Arial, sans-serif;
      font-size: 20px;
      font-weight: bold;
      fill: black;
    }
    .specification {
      font-family: Arial, sans-serif;
      font-size: 14px;
      fill: black;
    }
    .section-title {
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      fill: black;
    }
    .container {
      transform: translate(50, 50);
    }
  </style>
  
  <!-- Main container -->
  <g class="container">
    <!-- Product Section -->
    <text class="product-title" x="0" y="0">Product</text>
    <text class="product-name" x="0" y="30">Revopoint MIRACO Plus</text>
    <text class="product-name" x="0" y="60">Revopoint POP 4</text>
    <text class="product-name" x="0" y="90">Revopoint MINI 2</text>
    <text class="product-name" x="0" y="120">Revopoint INSPIRE 2</text>
    <text class="product-name" x="0" y="150">Revopoint MetroX</text>
    <text class="product-name" x="0" y="180">Revopoint MetroY Ultra</text>
    <text class="product-name" x="0" y="210">Revopoint Trackit SR</text>
    
    <!-- Product Category Section -->
    <text class="section-title" x="0" y="260">Product category</text>
    <text class="specification" x="0" y="290">Standalone</text>
    <text class="specification" x="0" y="310">Hybrid portable</text>
    <text class="specification" x="0" y="330">Blue-light detail</text>
    <text class="specification" x="0" y="350">Entry portable</text>
    <text class="specification" x="0" y="370">Industrial blue-laser</text>
    <text class="specification" x="0" y="390">Measurement blue-light</text>
    <text class="specification" x="0" y="410">Optical tracking</text>
    <text class="specification" x="0" y="430">Best-fit workflow</text>
    
    <!-- Usage Environment Section -->
    <text class="section-title" x="0" y="480">Usage environment</text>
    <text class="specification" x="0" y="510">Small-large; field</text>
    <text class="specification" x="0" y="530">General; outdoor</text>
    <text class="specification" x="0" y="550">Small parts; fine geometry</text>
    <text class="specification" x="0" y="570">Beginners; makers; printing</text>
    <text class="specification" x="0" y="590">Dark/shiny parts</text>
    <text class="specification" x="0" y="610">Inspection; reverse engineering</text>
    <text class="specification" x="0" y="630">Large objects; field</text>
    
    <!-- Key Strength Section -->
    <text class="section-title" x="0" y="680">Key strength</text>
    <text class="specification" x="0" y="710">0.04 mm single-frame; measurement kit</text>
    <text class="specification" x="0" y="730">Blue laser + infrared; Al</text>
    <text class="specification" x="0" y="750">Up to 0.02 mm precision</text>
    <text class="specification" x="0" y="770">Infrared laser + structured light; 0.05 + 0.1 xL(m)</text>
    <text class="specification" x="0" y="790">Four modes; up to 0.02 mm</text>
    <text class="specification" x="0" y="810">0.015 + 0.04 x L (m) volumetric</text>
    <text class="specification" x="0" y="830">Marker-free; 0.025 + 0.04 x L (m)</text>
  </g>
</svg>