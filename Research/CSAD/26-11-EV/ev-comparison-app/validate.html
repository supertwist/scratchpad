<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV App Validation</title>
</head>
<body>
    <h1>EV Comparison App Validator</h1>
    <p>This page checks if the EV comparison app is functioning correctly.</p>
    
    <div id="status">Checking application...</div>
    
    <script src="js/data-handler.js"></script>
    <script>
        // Simple validation
        window.addEventListener('load', function() {
            const statusDiv = document.getElementById('status');
            
            try {
                // Test if class exists and can be instantiated  
                console.log("Checking EVDataHandler...");
                const handler = new EVDataHandler();
                
                if (handler) {
                    statusDiv.innerHTML = '<p style="color: green;">✓ EV Data Handler initialized successfully</p>';
                    console.log("EV Data Handler working");
                    
                    // Check if there are any manufacturers
                    const manufacturers = handler.getManufacturers();
                    statusDiv.innerHTML += '<p style="color: green;">✓ Found ' + manufacturers.length + ' manufacturers</p>';
                    console.log("Manufacturers found:", manufacturers.length);
                } else {
                    statusDiv.innerHTML = '<p style="color: red;">✗ Failed to initialize data handler</p>';
                }
            } catch (error) {
                statusDiv.innerHTML = '<p style="color: red;">✗ Error during validation: ' + error.message + '</p>';
                console.error("Validation error:", error);
            }
        });
    </script>
</body>
</html>
