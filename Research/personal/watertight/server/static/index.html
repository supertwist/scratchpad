<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watertight — STL repair</title>
<link rel="stylesheet" href="/static/watertight.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f6df6' stroke-width='1.8'%3E%3Cpath d='M12 2.7c3.2 3.6 5.6 6.7 5.6 9.4a5.6 5.6 0 0 1-11.2 0c0-2.7 2.4-5.8 5.6-9.4z'/%3E%3C/svg%3E">
</head>
<body>

<header>
  <span class="brand"><span class="drop-icon" id="brandIcon"></span> Watertight</span>
  <span class="spacer"></span>
  <span class="status" id="status" data-state="idle"><span class="dot"></span><span id="statusText">Connecting…</span></span>
  <button class="ghost small" id="tokenBtn">Token</button>
</header>

<main>

  <div class="card hidden" id="tokenCard">
    <h3>Access token</h3>
    <div class="body">
      <div class="field">
        <label for="token">Class access token</label>
        <input id="token" type="password" spellcheck="false" placeholder="Provided by your instructor">
        <span class="hint">Stored only in this browser.</span>
      </div>
      <div class="actions">
        <button class="primary" id="saveToken">Save</button>
        <button class="ghost" id="closeToken">Close</button>
      </div>
    </div>
  </div>

  <p class="upload-cap" id="uploadCap">Max upload is 50MB</p>

  <div class="dropzone" id="dropzone">
    <div class="arrow" id="dropArrow"></div>
    <h2>Drop an STL here</h2>
    <p>or click to choose a file — it will be checked, repaired, and downloaded automatically</p>
    <input type="file" id="fileInput" accept=".stl">
  </div>

  <div class="card hidden" id="workingCard">
    <div class="body working">
      <div class="what" id="workingWhat">Uploading…</div>
      <div class="progress"><i></i></div>
    </div>
  </div>

  <div class="card hidden" id="errorCard">
    <h3>Something went wrong</h3>
    <div class="body">
      <div class="error-text" id="errorText"></div>
      <div class="actions" style="margin-top:12px">
        <button class="small" id="errorRetry">Try again</button>
      </div>
    </div>
  </div>

  <div class="saved hidden" id="savedBanner">
    <span id="savedIcon"></span>
    <span>Downloaded <span class="path" id="savedPath"></span></span>
  </div>

  <div id="results"></div>

  <div class="actions hidden" id="resultActions">
    <button class="primary" id="anotherBtn">Repair another file</button>
    <button class="small" id="downloadAgainBtn">Download again</button>
  </div>

</main>

<footer>
  <span>Watertight</span>
  <span class="spacer"></span>
  <span id="footInfo"></span>
</footer>

<script src="/static/core.js"></script>
<script src="/static/web.js"></script>
</body>
</html>
