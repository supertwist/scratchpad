<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech → Text</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Speech → Text</h1>
      <p class="sub">Drop audio files below. Transcripts download automatically as <code>.txt</code>.</p>
    </header>

    <div id="drop" class="dropzone" tabindex="0" role="button"
         aria-label="Drop audio files here or click to browse">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 16V4m0 0L8 8m4-4 4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
      </svg>
      <p class="dz-title">Drop <strong>.AIF</strong> files here</p>
      <p class="dz-hint">or click to browse &middot; also accepts wav, mp3, m4a, flac</p>
      <input type="file" id="picker" multiple accept=".aif,.aiff,.aifc,.wav,.mp3,.m4a,.mp4,.flac,.ogg,.opus,.caf" hidden>
    </div>

    <ul id="queue" class="queue" aria-live="polite"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
